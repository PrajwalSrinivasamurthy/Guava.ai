[project]
name = "inbound-grad"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "guava-sdk>=0.41.0",
    "typing_extensions",
    "websockets",
    "gsheets",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "agent_testing",
]

[tool.uv.sources]
gsheets = { path = "../patterns/gsheets" }
agent_testing = { path = "../patterns/agent_testing", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
