name: cla-kb

# Run from the server as:
#   docker compose --env-file ~/cla-kb/.env -f ~/cla-kb/kb-service/infra/docker-compose.yml up -d --build
# KB_DB_PASSWORD comes from ~/cla-kb/.env and the service's own settings from
# ~/cla-kb/service.env (see service.env.example); neither file is in git.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:?set KB_DB_PASSWORD in ~/cla-kb/.env}
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../service.env
    environment:
      DATABASE_URL: postgresql://kb:${KB_DB_PASSWORD}@postgres:5432/kb
    ports:
      - "127.0.0.1:8120:8120"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8120/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
