name: cla-kb

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:?set KB_DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
